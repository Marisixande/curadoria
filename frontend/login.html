<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Curadoria JWT</title>
</head>
<body>
  <div class="formulario">
      <form id="form">
        <input type="email" name="email" id="email">
        <input type="password" name="password" id="password">
      </form>
    <button onclick="login_usuario()">Login</button>
  </div>
  <p>Ainda não fez o cadastro? Faça <a href="./index.html">aqui</a></p>
</body>
<script>
 async function login_usuario(){
    const dados_usuarios = document.getElementById('form');
    const dados_objeto = Object.fromEntries(new FormData(dados_usuarios));
    const dados_json = JSON.stringify(dados_objeto);
    // console.log(dados_json);
     const req = await fetch(
      ` http://localhost:3000/auth/login`,
      {
        method: 'POST',
        headers: {
          "Content-type":"application/json"
        //   ,"Authorization": "Bearer <token>"
        },
        body: dados_json
      }
    );
    const res = await req.json();
    console.log(res)
    if(!req.ok){
      alert(res.message)
      throw new Error(`Erro ao enviar requisição: ${req.status}`);

    }
    localStorage.setItem('accessToken', res.accessToken);
    console.log(res.accessToken);
  }
</script>
</html>
